<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!--
    Monograma de Gabriel García.

    La G va dentro de una placa chaflanada por una razón concreta: a 16px, que
    es el tamaño real de una pestaña, una letra suelta adelgaza y se pierde
    contra el fondo del navegador. El marco le da masa y silueta reconocible.
    Los chaflanes están en las mismas esquinas que el `clip-corner` del sitio
    (arriba-izquierda y abajo-derecha), así que la marca y las tarjetas hablan
    el mismo idioma.
  -->
  <path
    fill="#04010f"
    stroke="#00f0ff"
    stroke-width="2"
    d="M2 18 L18 2 H78 V62 L62 78 H2 Z"
  />
  <g transform="translate(8 8)">
    <path
      fill="#00f0ff"
      fill-rule="evenodd"
      d="M 4 16 L 16 4 L 60 4 L 60 18 L 48 18 L 48 16 L 20 16 L 18 18 L 18 46 L 20 48 L 46 48 L 46 40 L 34 40 L 34 28 L 60 28 L 60 48 L 48 60 L 16 60 L 4 48 Z"
    />
  </g>
</svg>
