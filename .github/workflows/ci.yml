name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un despliegue de Vercel puede tardar; no dejamos builds viejos corriendo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Tipos, build y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # npm ci y no npm install: falla si package-lock.json no cuadra con
      # package.json, que es justo lo que queremos que pase en CI.
      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run check

      - name: Comprobar formato
        run: npm run format:check

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Build y tests end-to-end
        run: npm run test:e2e

      - name: Guardar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
